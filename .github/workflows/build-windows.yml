name: Build Windows Executable

on:
  push:
    branches: [ "main" ] # Triggers automatically when you push to main
  workflow_dispatch:     # Adds a "Run workflow" button in the GitHub UI for manual triggers

jobs:
  build:
    runs-on: windows-latest # Tells GitHub to spin up a Windows Server to build this

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 3.10 is highly stable for PyInstaller

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Emulsifier Executable
      # We use --windowed to hide the black console terminal
      # We use --collect-all to ensure customtkinter themes and tkinterdnd2 binaries are packaged
      run: |
        pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all tkinterdnd2 --name "Emulsifier_v1.77" renderer_v76.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Emulsifier-Windows-EXE
        path: dist/Emulsifier_v1.77.exe
